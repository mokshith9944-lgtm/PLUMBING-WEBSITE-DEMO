<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="copperGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="75%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="brassValve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>

  <!-- Clean, dry basement wall background -->
  <rect width="800" height="500" fill="url(#bgGradAfter)"/>

  <!-- Clean wall texture -->
  <g opacity="0.2" stroke="#64748b" stroke-width="2">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
  </g>

  <!-- Newly Installed Copper & Brass Assembly -->
  <g>
    <!-- Pipe drop shadow -->
    <rect x="100" y="222" width="600" height="66" rx="6" fill="#000000" opacity="0.4"/>

    <!-- Left Copper Pipe Section -->
    <rect x="100" y="215" width="250" height="64" rx="4" fill="url(#copperGleam)"/>

    <!-- Right Copper Pipe Section -->
    <rect x="450" y="215" width="250" height="64" rx="4" fill="url(#copperGleam)"/>

    <!-- Premium Brass Ball Valve Body -->
    <rect x="330" y="200" width="140" height="94" rx="12" fill="url(#brassValve)" stroke="#ca8a04" stroke-width="3"/>

    <!-- Valve Hex Fittings -->
    <polygon points="340,205 355,195 370,205 370,290 355,300 340,290" fill="#fde047" opacity="0.9"/>
    <polygon points="430,205 445,195 460,205 460,290 445,300 430,290" fill="#fde047" opacity="0.9"/>

    <!-- Quarter-turn Shutoff Lever Handle (Safety Blue / Steel) -->
    <rect x="385" y="110" width="28" height="100" rx="8" fill="#1e40af" stroke="#ffffff" stroke-width="2"/>
    <circle cx="399" cy="205" r="14" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="399" cy="205" r="6" fill="#0f172a"/>

    <!-- Wall Mounting Heavy-Duty Pipe Clamps with rubber dampeners -->
    <g>
      <rect x="180" y="195" width="20" height="104" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <circle cx="190" cy="180" r="4" fill="#cbd5e1"/>
      <circle cx="190" cy="315" r="4" fill="#cbd5e1"/>

      <rect x="600" y="195" width="20" height="104" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <circle cx="610" cy="180" r="4" fill="#cbd5e1"/>
      <circle cx="610" cy="315" r="4" fill="#cbd5e1"/>
    </g>

    <!-- Inspection Pass Tag / Seal -->
    <g transform="translate(480, 290)">
      <polygon points="20,0 40,15 40,45 20,60 0,45 0,15" fill="#10b981"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    </g>
  </g>

  <!-- Success Tag overlay -->
  <g transform="translate(550, 40)">
    <rect width="210" height="50" rx="8" fill="#10b981" opacity="0.95"/>
    <text x="105" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ✓ AFTER: Precision Repiped
    </text>
  </g>
</svg>

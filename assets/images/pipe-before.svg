<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pipeRusty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#542805"/>
      <stop offset="80%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="corrosionNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0.8 0 0 0 0.4  0 0.5 0 0 0.2  0 0 0.2 0 0.1  0 0 0 0.7 0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Dark basement wall background -->
  <rect width="800" height="500" fill="url(#bgGradBefore)"/>
  
  <!-- Wall texture lines -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
  </g>

  <!-- Water stain on wall -->
  <path d="M 320,180 Q 360,250 350,380 Q 420,400 480,360 Q 440,240 400,190 Z" fill="#0284c7" opacity="0.2"/>

  <!-- Rusty, Corroded Main Pipe -->
  <g>
    <!-- Pipe drop shadow -->
    <rect x="100" y="220" width="600" height="70" rx="6" fill="#000000" opacity="0.4"/>
    
    <!-- Main pipe cylinder -->
    <rect x="100" y="210" width="600" height="70" rx="6" fill="url(#pipeRusty)"/>

    <!-- Joint collars (rusty/calcified) -->
    <rect x="260" y="198" width="36" height="94" rx="4" fill="#713f12" stroke="#451a03" stroke-width="3"/>
    <rect x="480" y="198" width="36" height="94" rx="4" fill="#713f12" stroke="#451a03" stroke-width="3"/>

    <!-- Severe corrosion spots and limescale -->
    <circle cx="380" cy="245" r="18" fill="#451a03" opacity="0.85"/>
    <circle cx="385" cy="240" r="12" fill="#78350f"/>
    <path d="M 370,245 Q 380,255 395,248" stroke="#fef08a" stroke-width="3" fill="none" opacity="0.8"/>
    
    <!-- Limescale build-up -->
    <ellipse cx="280" cy="275" rx="22" ry="8" fill="#e2e8f0" opacity="0.75"/>
    <ellipse cx="498" cy="280" rx="26" ry="10" fill="#e2e8f0" opacity="0.75"/>

    <!-- Active leak drip -->
    <path d="M 382,260 Q 386,275 384,285 Q 382,295 385,305" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <circle cx="385" cy="325" r="7" fill="#38bdf8" opacity="0.9"/>
    <circle cx="385" cy="365" r="5" fill="#38bdf8" opacity="0.7"/>

    <!-- Floor puddle -->
    <ellipse cx="390" cy="440" rx="90" ry="22" fill="#0284c7" opacity="0.45"/>
    <ellipse cx="388" cy="440" rx="70" ry="16" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Problem Tag overlay -->
  <g transform="translate(40, 40)">
    <rect width="210" height="50" rx="8" fill="#dc2626" opacity="0.95"/>
    <text x="105" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ⚠️ BEFORE: Severe Corrosion
    </text>
  </g>
</svg>
